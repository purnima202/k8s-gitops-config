replicaCount: 2

image:
  repository: hashicorp/http-echo
  tag: "1.0.0"
  pullPolicy: IfNotPresent

containerPort: 5678

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  host: payments.example.com

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

config:
  message: "Welcome to Payments Service"

secret:
  apiKey: "REPLACE_ME"
