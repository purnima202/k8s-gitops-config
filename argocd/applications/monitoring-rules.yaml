apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-rules
  namespace: argocd
spec:
  project: gitops-platform
  source:
    repoURL: https://github.com/purnima202/k8s-gitops-config.git
    targetRevision: main
    path: monitoring/prometheus-rules
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true