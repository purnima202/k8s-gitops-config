alertmanager:
  alertmanagerSpec:
    secrets:
      - alertmanager-slack

  config:
    global:
      resolve_timeout: 5m

    route:
      receiver: slack-notifications
      group_by:
        - alertname
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h

    receivers:
      - name: slack-notifications
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/slack_api_url
            channel: "#devops-alerts"
            send_resolved: true